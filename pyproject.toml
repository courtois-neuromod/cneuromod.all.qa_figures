[project]
name = "cneuromod-all-qa-figures"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "airoh>=0.3.2",
    "datalad",
    "invoke",
    "requests",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "numpy",
    "pybids>=0.16",
    "seaborn>=0.12",
    "ptitprince",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
