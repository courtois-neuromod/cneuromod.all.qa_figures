[project]
name = "cneuromod-all-qa-figures"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "airoh>=0.3.2",
    "datalad",
    # git-annex >= 10 is required: cneuromod.all subdatasets are annex v10 format,
    # which an old system git-annex (e.g. Ubuntu's apt 8.x) refuses to fetch. This
    # PyPI package bundles a recent standalone binary so `uv sync` guarantees >= 10.
    "git-annex>=10.20230126",
    "invoke",
    "requests",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "numpy",
    "nibabel>=5.0",
    "nilearn>=0.10",
    "pybids>=0.16",
    "seaborn>=0.12",
    "ptitprince",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
