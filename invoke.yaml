# invoke.yaml

# Code folder
code_dir: analysis

# Notebooks folders
notebooks_dir: notebooks

# source data folders
source_data_dir: source_data

# output data folders
output_data_dir: output_data

# file sources
#
# Each asset defines `output_file` plus `url` and/or `source`:
#   - `url`    : download the file over HTTP into `output_file`
#   - `source` : path to already-present data to symlink into `output_file`
#                instead of downloading (a per-asset alternative to the
#                `invoke fetch-{name} --source ...` flag)
files:
  papers:
    url: https://api.figshare.com/v2/file/download/9843721
    output_file: source_data/YNIMG_BrainParcellation_summary.tsv
    # source: /path/to/existing/file.tsv   # symlink instead of downloading
