# invoke.yaml

# Code folder
code_dir: analysis

# Notebooks folders
notebooks_dir: notebooks

# source data folders
source_data_dir: source_data

# output data folders
output_data_dir: output_data

# figures base dir — each notebook writes into figures_dir/<notebook_stem>/,
# which airoh also uses as the "already ran" sentinel for that notebook.
figures_dir: output_data/figures

# Canonical target for `invoke run --smoke` (overridable with --dataset). Must be
# a dataset that genuinely has functional MRIQC data AND ships an upstream
# per-subject `stat-avgtsnr` map, so the strict smoke test exercises both the
# qc-measures and the tsnr-maps steps end-to-end. floc is the smallest dataset
# satisfying both (fLoc task MRIQC + a stat-avgtsnr map for 3 subjects); hcptrt
# has functional MRIQC but NO avgtsnr, so it cannot smoke-test tsnr-maps.
smoke_dataset: floc

# Datalad datasets
#
# The cneuromod.all superdataset is the sole data source. It is a Datalad
# superdataset holding many subdatasets whose file content is retrieved on
# demand by the analysis steps (`datalad get`), not all at once.
#
#   - `url`        : remote to clone when no local checkout is available
#   - `output_dir` : where the superdataset is made available inside source_data/
#   - `source`     : path to an existing local checkout to use instead of cloning.
#                    This is the primary use case here — cneuromod.all already
#                    lives at ../cneuromod.all — and can be overridden on the
#                    command line with `invoke fetch --source /path`.
datasets:
  cneuromod_all:
    url: https://github.com/courtois-neuromod/cneuromod.all
    output_dir: source_data/cneuromod.all
    source: ../cneuromod.all
  # ICBM152 2009c MNI template (nilearn.datasets.fetch_icbm152_2009), used only
  # as the anatomical background for the tSNR coverage montages. A plain cached
  # download — no url/source symlink semantics, unlike cneuromod_all above.
  nilearn:
    output_dir: source_data/nilearn
